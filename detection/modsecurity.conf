# ============================================================================
# php2shell — ModSecurity Rules
# CVE-2026-109618 / CVE-2026-109619
#
# Compatible with ModSecurity v2/v3 and libmodsecurity.
# Place in your modsecurity conf directory or Include from modsecurity.conf.
#
# Rule ID range: 9900100 - 9900119
# Author: Qi Deng (@ikow)
# Reference: https://github.com/ikow/php2shell-poc
# ============================================================================

# --- Rule 9900100: Block PHP_SESSION_UPLOAD_PROGRESS in multipart POST ---
# Primary attack trigger for both CVEs. Near-zero legitimate use.
SecRule REQUEST_METHOD "POST" \
    "id:9900100, \
    phase:2, \
    deny, \
    status:403, \
    log, \
    msg:'php2shell: PHP_SESSION_UPLOAD_PROGRESS in request body', \
    tag:'CVE-2026-109618', \
    tag:'CVE-2026-109619', \
    tag:'php2shell', \
    severity:'CRITICAL', \
    chain"
    SecRule REQUEST_BODY "@contains PHP_SESSION_UPLOAD_PROGRESS" \
        "chain"
        SecRule REQUEST_HEADERS:Content-Type "@contains multipart/form-data"

# --- Rule 9900101: Detect PHPSESSID in multipart POST body ---
# Session fixation via POST body. Alert only — some legacy apps may do this.
SecRule REQUEST_METHOD "POST" \
    "id:9900101, \
    phase:2, \
    log, \
    noauditlog, \
    pass, \
    msg:'php2shell: PHPSESSID in POST body (session fixation indicator)', \
    tag:'CVE-2026-109618', \
    tag:'php2shell', \
    severity:'WARNING', \
    chain"
    SecRule REQUEST_BODY "@rx name=[\"']?PHPSESSID[\"']?" \
        "chain"
        SecRule REQUEST_HEADERS:Content-Type "@contains multipart/form-data"

# --- Rule 9900102: Block PHP code in upload filenames ---
# Session injection: PHP code stored in session file via filename field.
SecRule MULTIPART_FILENAME "@rx <\?(?:php|=)" \
    "id:9900102, \
    phase:2, \
    deny, \
    status:403, \
    log, \
    msg:'php2shell: PHP code in upload filename', \
    tag:'CVE-2026-109618', \
    tag:'php2shell', \
    severity:'CRITICAL'"

# --- Rule 9900103: Block serialized PHP objects in upload filenames ---
# Handler mismatch attack: pipe + serialized object in filename.
SecRule MULTIPART_FILENAME "@rx \|[OaCr]:\d+:" \
    "id:9900103, \
    phase:2, \
    deny, \
    status:403, \
    log, \
    msg:'php2shell: serialized PHP object in upload filename', \
    tag:'CVE-2026-109619', \
    tag:'php2shell', \
    severity:'CRITICAL'"

# --- Rule 9900104: Detect PHP OOM in response (exploitation indicator) ---
# Response-side: detects successful OOM trigger.
SecRule RESPONSE_BODY "@rx Allowed memory size.{1,50}exhausted" \
    "id:9900104, \
    phase:4, \
    log, \
    pass, \
    msg:'php2shell: PHP OOM detected in response (possible exploitation)', \
    tag:'CVE-2026-109618', \
    tag:'php2shell', \
    severity:'HIGH'"

# --- Rule 9900105: Detect session destruction failure in response ---
# Direct evidence of CVE-2026-109619 stale state exploitation.
SecRule RESPONSE_BODY "@contains Session object destruction failed" \
    "id:9900105, \
    phase:4, \
    log, \
    pass, \
    msg:'php2shell: session destruction failure (stale state exploitation)', \
    tag:'CVE-2026-109619', \
    tag:'php2shell', \
    severity:'CRITICAL'"

# --- Rule 9900106: Block chunked multipart POST (OOM bypass) ---
# Missing Content-Length on multipart bypasses PHP's post_max_size check,
# enabling unlimited memory consumption during parsing.
SecRule REQUEST_METHOD "POST" \
    "id:9900106, \
    phase:1, \
    deny, \
    status:400, \
    log, \
    msg:'php2shell: chunked multipart POST (post_max_size bypass)', \
    tag:'CVE-2026-109618', \
    tag:'php2shell', \
    severity:'HIGH', \
    chain"
    SecRule REQUEST_HEADERS:Content-Type "@contains multipart/form-data" \
        "chain"
        SecRule REQUEST_HEADERS:Transfer-Encoding "@contains chunked"
# ═══════════════════════════════════════════════════════════════════════
# NEW CHAIN RULES (F, G, H)
# Rule ID range: 9900120 - 9900139
# ═══════════════════════════════════════════════════════════════════════

# --- Rule 9900120: Chain F — Session Key Smuggling (pipe + object in upload_progress) ---
SecRule REQUEST_METHOD "POST" \
    "id:9900120, \
    phase:2, \
    deny, \
    status:403, \
    log, \
    msg:'php2shell Chain F: Session Key Smuggling — pipe+object in upload_progress', \
    tag:'CVE-2026-109619', \
    chain"
    SecRule REQUEST_BODY "@rx PHP_SESSION_UPLOAD_PROGRESS.{0,50}\|.{0,10}O:" \
        "t:none, \
        chain"
        SecRule REQUEST_HEADERS:Content-Type "@contains multipart/form-data"

# --- Rule 9900121: Chain G — OPcache Poisoning (file_put_contents to .php) ---
SecRule REQUEST_BODY "@rx file_put_contents.{0,100}\.php" \
    "id:9900121, \
    phase:2, \
    deny, \
    status:403, \
    log, \
    msg:'php2shell Chain G: OPcache poisoning — write to PHP file', \
    tag:'CVE-2026-109618'"

# --- Rule 9900122: Chain G — OPcache write+restore pattern ---
SecRule REQUEST_BODY "@contains ___START___" \
    "id:9900122, \
    phase:2, \
    deny, \
    status:403, \
    log, \
    msg:'php2shell Chain G: OPcache poisoning marker', \
    chain"
    SecRule REQUEST_BODY "@contains file_put_contents"

# --- Rule 9900123: Chain H — ZMM Grooming (many sequential form fields) ---
SecRule REQUEST_BODY "@rx name=\"g0\".{0,500}name=\"g1\".{0,500}name=\"g2\"" \
    "id:9900123, \
    phase:2, \
    deny, \
    status:403, \
    log, \
    msg:'php2shell Chain H: ZMM grooming — sequential allocation spray', \
    tag:'CVE-2026-109618'"

# --- Rule 9900124: Chain H — ZMM trigger code ---
SecRule REQUEST_BODY "@contains ZMM_TRIGGER_OK" \
    "id:9900124, \
    phase:2, \
    deny, \
    status:403, \
    log, \
    msg:'php2shell Chain H: ZMM trigger marker'"

# --- Rule 9900125: PHAR Bomb — phar:// wrapper ---
SecRule REQUEST_URI "@rx (?i)phar://" \
    "id:9900125, \
    phase:1, \
    deny, \
    status:403, \
    log, \
    msg:'php2shell PHAR Bomb: phar:// wrapper in URI'"

# --- Rule 9900126: php://filter chain (iconv oracle) ---
SecRule REQUEST_URI "@rx (?i)php://filter/convert\.iconv\." \
    "id:9900126, \
    phase:1, \
    deny, \
    status:403, \
    log, \
    msg:'php2shell LFI escalation: php://filter iconv chain'"

# --- Rule 9900127: data:// wrapper (direct exec) ---
SecRule REQUEST_URI "@rx (?i)data://text/plain;base64," \
    "id:9900127, \
    phase:1, \
    deny, \
    status:403, \
    log, \
    msg:'php2shell LFI escalation: data:// wrapper'"

# --- Rule 9900128: Session Fixation probe ---
SecRule REQUEST_COOKIES:PHPSESSID "@rx ^fixtest" \
    "id:9900128, \
    phase:1, \
    deny, \
    status:403, \
    log, \
    msg:'php2shell Session Fixation: probe SID detected'"

# --- GHOST DOOR persistence detection (2026-10-24) ---
SecRule REQUEST_URI "@rx /\.tpl_[0-9a-f]+\.php" \
    "id:9900130,phase:1,deny,status:403,log,msg:'php2shell GHOST: template-cache poison file'"
SecRule REQUEST_URI "@rx /\.ghost_inc\.php|/\.user\.ini" \
    "id:9900131,phase:1,deny,status:403,log,msg:'php2shell GHOST: .user.ini/ghost_inc access'"
SecRule ARGS:g "@rx ^[A-Za-z0-9+/=]{20,}$" \
    "id:9900132,phase:2,deny,status:403,log,msg:'php2shell GHOST: ?g= eval request'"
SecRule REQUEST_BODY "@rx GIF89a.{0,200}<\?php" \
    "id:9900133,phase:2,deny,status:403,log,msg:'php2shell GHOST: GIF89a+PHP polyglot'"
SecRule REQUEST_URI "@rx autoload_files\.php" \
    "id:9900134,phase:1,deny,status:403,log,msg:'php2shell GHOST: composer autoload injection'"
