---
title: php2shell LFI to RCE via php://filter chains
id: 9d6f0e2f-4a5b-6c7d-8e9f-0a1b2c3d4e5f
status: experimental
description: Detects php://filter iconv chain attempts (Synacktiv technique)
author: php2shell-toolkit
date: 2026/01/01
tags:
    - attack.execution
    - attack.t1505.003
logsource:
    category: webserver
    product: apache
detection:
    selection_filter:
        cs-uri-query|re: 'php://filter/convert\.iconv\.'
