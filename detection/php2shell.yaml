---
title: php2shell GHOST DOOR — Persistence Primitives
id: a1f2e3d4-5678-9abc-def0-php2shell006
status: experimental
description: >
  Detects GHOST DOOR persistence artifacts planted by the php2shell
  post-exploit module: template-cache poisoned files (.tpl_*.php),
  .user.ini auto_prepend drops, session-dir resurrection files,
  GIF89a+PHP polyglots, and composer autoload injection.
author: Qi Deng (@ikow)
date: 2026-10-24
logsource:
  category: webserver
detection:
  selection_uri:
    http_uri|contains:
      - '/.tpl_'
      - '/.ghost_inc.php'
      - '/.user.ini'
      - 'autoload_files.php'
  selection_param:
    http_uri|contains:
      - '?g='
  condition: selection_uri or selection_param
falsepositives:
  - Legitimate template engines may generate .tpl files (check extension .php)
  - Composer autoload_files.php modifications during deployments
level: high
tags:
  - attack.persistence
  - attack.t1505_003
  - cve.2026-109618
